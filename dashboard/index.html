<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jackson County Motivated Seller Leads</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#ddd;--hd:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--line:#333;--hd:#222}}
body{font:14px system-ui,sans-serif;margin:1rem;background:var(--bg);color:var(--fg)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{background:var(--hd);cursor:pointer;position:sticky;top:0}.mut{color:var(--mut)}
a{color:inherit}
</style></head><body>
<h2>Jackson County Motivated Seller Leads</h2>
<p class="mut" id="meta">Loading…</p>
<div class="wrap"><table><thead><tr id="h"></tr></thead><tbody id="b"></tbody></table></div>
<script>
const cols=[["score","Score"],["cat_label","Type"],["filed","Filed"],["owner","Owner"],["prop_address","Property"],["mail_address","Mailing"],["amount","Amount"],["flags","Flags"],["doc_num","Doc #"]];
let rows=[],sort="score",dir=-1;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function draw(){
  rows.sort((a,b)=>{const x=a[sort],y=b[sort];return (x>y?1:x<y?-1:0)*dir});
  document.getElementById("b").innerHTML=rows.map(r=>"<tr>"+cols.map(([k])=>{
    let v=r[k]; if(k==="flags")v=(v||[]).join(", ");
    if(k==="amount")v=v?"$"+Number(v).toLocaleString():"";
    if(k==="doc_num"&&r.clerk_url)return `<td><a href="${esc(r.clerk_url)}" target="_blank" rel="noopener">${esc(v)}</a></td>`;
    return "<td>"+esc(v)+"</td>"}).join("")+"</tr>").join("");
}
fetch("records.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  rows=d.records||[];
  document.getElementById("meta").textContent=`${d.total} leads · ${d.with_address} with address · ${d.date_range||"no data yet"} · updated ${d.fetched_at||"never"}`;
  const h=document.getElementById("h");
  cols.forEach(([k,l])=>{const th=document.createElement("th");th.textContent=l;th.onclick=()=>{dir=sort===k?-dir:-1;sort=k;draw()};h.appendChild(th)});
  draw();
}).catch(e=>document.getElementById("meta").textContent="Could not load records.json");
</script></body></html>
